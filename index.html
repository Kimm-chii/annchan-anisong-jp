    <!-- Instant Static Head Hydration for relative-to-absolute URLs -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var href = window.location.href;
          var img = origin + "/og-preview.jpg";
          
          var ogUrl = document.getElementById("meta-og-url");
          if (ogUrl) ogUrl.setAttribute("content", href);

          var ogImg = document.getElementById("meta-og-image");
          if (ogImg) ogImg.setAttribute("content", img);

          var ogImgSec = document.getElementById("meta-og-image-secure");
          if (ogImgSec) ogImgSec.setAttribute("content", img);

          var twImg = document.getElementById("meta-twitter-image");
          if (twImg) twImg.setAttribute("content", img);
        } catch(e) {}
      })();
    </script>
